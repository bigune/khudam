<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Cyrillic initial of the name, nothing cleverer. The two diagonals
       carry serif-style contrast (one thick, one thin, flat ends) so the
       letter reads as type rather than as a close button; uniform rounded
       strokes made it one. Colours mirror the bg/panel and ink tokens in
       globals.css. (No double hyphen may appear in this comment: SVG is
       strict XML, and one broke the whole favicon once.) -->
  <style>
    .paper { fill: #faf9f7 }
    .ink { stroke: #1a1c1e }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #181b1e }
      .ink { stroke: #e8e6e3 }
    }
  </style>
  <rect class="paper" width="64" height="64" rx="14"/>
  <path class="ink" d="M21 19 L43 45" fill="none" stroke-width="9"/>
  <path class="ink" d="M43 19 L21 45" fill="none" stroke-width="4"/>
</svg>
