<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- An open book: the site is a lexicon before it is anything else. Glyph
       adapted from SVG Repo (svgrepo.com, "library" icon), set into the
       64-unit tile. Colours mirror the bg/panel and ink tokens in
       globals.css. (No double hyphen may appear in this comment: SVG is
       strict XML, and one broke the whole favicon once.) -->
