<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Not a letter. Every Mongol bichig word hangs off one vertical spine and
       opens with a crown stroke; this is that shape and nothing more specific,
       because a real glyph drawn by hand here would be an encoding claim the
       data does not make. Colours mirror the bg/panel and ink tokens in
       globals.css. (No double hyphen may appear in this comment: SVG is
       strict XML, and one broke the whole favicon once.) -->
  <style>
    .paper { fill: #faf9f7 }
    .ink { fill: #1a1c1e }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #181b1e }
      .ink { fill: #e8e6e3 }
    }
  </style>
  <rect class="paper" width="64" height="64" rx="14"/>
  <!-- The titem is a pennant, not a bar: a pointed tip at the left, the
       stroke thickening as it rises into the head of the spine. Drawn as a
       perpendicular rectangle it read as the digit 1. -->
  <path class="ink" d="M14 19 L33 11 L41 11 L41 22 L33 23 Z"/>
  <rect class="ink" x="33" y="11" width="8" height="43" rx="3"/>
</svg>
